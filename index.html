<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#0c2a20" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="牌を並べるだけで役・翻・符・点数と精算まで計算できる麻雀点数計算アプリ" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <title>麻雀点数計算</title>
  </head>
  <body>
    <div id="root">
      <div id="boot" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;background:#0c2a20;color:#e8dcc0;font-family:'Hiragino Mincho ProN','Yu Mincho',serif;text-align:center;padding:24px">
        <div style="font-size:22px;letter-spacing:.2em">麻雀点数計算</div>
        <div id="boot-msg" style="font-size:14px;opacity:.75">読み込み中…</div>
      </div>
    </div>
    <noscript>このアプリを使うには JavaScript を有効にしてください。</noscript>
    <script>
      // アプリが起動できなかったときに、白い画面のままにせず原因と対処を表示する
      (function () {
        var shown = false;
        function fail(reason) {
          var msg = document.getElementById('boot-msg');
          if (!msg || shown) return;
          shown = true;
          msg.style.opacity = '1';
          msg.innerHTML =
            '<p style="margin:0 0 10px">アプリを起動できませんでした。</p>' +
            '<p style="margin:0 0 14px;font-size:12px;line-height:1.7;max-width:320px">' + reason + '</p>' +
            '<button id="boot-reload" style="font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #b8955a;background:#b8955a;color:#1a1408;margin:4px">再読み込み</button>' +
            '<button id="boot-clear" style="font:inherit;padding:10px 18px;border-radius:10px;border:1px solid #b8955a;background:transparent;color:#e8dcc0;margin:4px">キャッシュを消して再読み込み</button>' +
            '<p style="margin:12px 0 0;font-size:11px;opacity:.7">※対局データは消えません</p>';
          document.getElementById('boot-reload').onclick = function () { location.reload(); };
          document.getElementById('boot-clear').onclick = function () {
            var jobs = [];
            if (navigator.serviceWorker) jobs.push(navigator.serviceWorker.getRegistrations().then(function (rs) { return Promise.all(rs.map(function (r) { return r.unregister(); })); }));
            if (window.caches) jobs.push(caches.keys().then(function (ks) { return Promise.all(ks.map(function (k) { return caches.delete(k); })); }));
            Promise.all(jobs).then(function () { location.reload(); }, function () { location.reload(); });
          };
        }
        window.addEventListener('error', function (e) {
          var t = e.target;
          if (t && t.tagName === 'SCRIPT') {
            fail('プログラムの読み込みに失敗しました。公開サイトの場合、GitHub の Settings → Pages の Source が「GitHub Actions」になっているか確認してください。');
          }
        }, true);
        setTimeout(function () {
          if (document.getElementById('boot')) {
            fail('通信状況が悪いか、古いデータが残っている可能性があります。「キャッシュを消して再読み込み」を試してください。');
          }
        }, 8000);
      })();
    </script>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
